name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # The core + scenario library + CLI are stdlib-only, so the suite runs
      # with no third-party install and no network access.
      - name: Run test suite
        run: pytest -q

      - name: Smoke-test the CLI loop (offline simulator)
        run: |
          python -m cyberange.cli list
          python -m cyberange.cli loop SC-001
          python -m cyberange.cli matrix

      # Regression gate: every mapped control must keep defending its scenario,
      # every attack must still fire, detection coverage must stay at 100%.
      - name: Control-validation regression gate
        run: python -m cyberange.ci_gate
